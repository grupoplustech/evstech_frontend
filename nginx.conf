# Main production portal: evstech.com.ve & www.evstech.com.ve
server {
    listen 80 default_server;
    server_name evstech.com.ve www.evstech.com.ve localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Clean URLs routing
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /index.html;
}

# Historical legacy portal proxy: old.evstech.com.ve -> original PHP host 54.39.103.33
server {
    listen 80;
    server_name old.evstech.com.ve;

    location / {
        proxy_pass http://54.39.103.33;
        proxy_set_header Host evstech.com.ve;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }
}
